<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>強度自相關分析</title>
<meta name="theme-color" content="#0b6e99">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="自相關分析">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3f6f8;--card:#fff;--ink:#14232e;--mute:#5c6f7c;--line:#d5dee4;--c1:#0b6e99;--c2:#2a7d4f;--fit:#c2410c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a21;--card:#17252e;--ink:#e6eef3;--mute:#93a7b4;--line:#2c4150;--c1:#5cc0ea;--c2:#6fd49b;--fit:#ff9b66}}
:root[data-theme="dark"]{--bg:#0f1a21;--card:#17252e;--ink:#e6eef3;--mute:#93a7b4;--line:#2c4150;--c1:#5cc0ea;--c2:#6fd49b;--fit:#ff9b66}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:4px 0 12px}
h2{font-size:1rem;margin:0 0 8px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.pick{display:block;text-align:center;background:var(--c1);color:#fff;border-radius:8px;padding:14px;font-weight:600;cursor:pointer}
.pick input{display:none}
#msg{color:var(--mute);font-size:.9rem;margin:8px 0 0}
canvas{width:100%;height:240px;display:block}
.wrap{position:relative}
#badge{position:absolute;top:10px;right:12px;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
#badge[hidden]{display:none}
.big{font-size:1.5rem;font-weight:700;color:var(--fit);line-height:1.2}
.sm{color:var(--mute);font-size:.9rem}
label.t{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>強度自相關分析</h1>
<section>
<label class="pick">選擇 Excel 檔案<input id="f" type="file" accept=".xlsx,.xls,.csv"></label>
<p id="msg">讀取 A 欄（時間，秒）與 L 欄（強度），皆從第 2 列開始。</p>
<label class="t"><input type="checkbox" id="sub" checked>自相關前先減去平均值</label>
</section>
<section><h2>強度隨時間變化</h2><canvas id="c1"></canvas></section>
<section><h2>自相關與擬合</h2>
<div class="wrap"><canvas id="c2"></canvas>
<div id="badge" hidden><div class="sm">特徵時間 t0</div><div class="big" id="t0"></div></div></div>
<p class="sm">擬合式：A·exp(−t/t0)+B（不含 t=0 點）</p>
<p class="sm" id="par"></p></section>
</main>
<script>
const $=id=>document.getElementById(id);
let data=null;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function fmt(v){const a=Math.abs(v);if(a!==0&&(a>=1e5||a<1e-3))return v.toExponential(2);return +v.toPrecision(4)+""}

function plot(cv,series,xl,yl){
  const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  const g=cv.getContext("2d");g.scale(dpr,dpr);g.clearRect(0,0,W,H);
  const L=52,R=8,T=8,B=34;
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  for(const s of series)for(let i=0;i<s.x.length;i++){const x=s.x[i],y=s.y[i];if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1===x0)x1=x0+1;const p=(y1-y0)*.06||1;y0-=p;y1+=p;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
  g.font="11px system-ui";g.fillStyle=css("--mute");g.strokeStyle=css("--line");g.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y=y0+(y1-y0)*i/4,x=x0+(x1-x0)*i/4;
    g.beginPath();g.moveTo(L,Y(y));g.lineTo(W-R,Y(y));g.stroke();
    g.textAlign="right";g.fillText(fmt(y),L-4,Y(y)+4);
    g.textAlign="center";g.fillText(fmt(x),X(x),H-B+14);
  }
  g.fillText(xl,(L+W-R)/2,H-4);
  g.save();g.translate(11,(T+H-B)/2);g.rotate(-Math.PI/2);g.fillText(yl,0,0);g.restore();
  g.save();g.beginPath();g.rect(L,T,W-L-R,H-T-B);g.clip();
  for(const s of series){
    g.strokeStyle=g.fillStyle=css(s.color);g.lineWidth=s.w||1.5;
    if(s.dots){for(let i=0;i<s.x.length;i++){g.beginPath();g.arc(X(s.x[i]),Y(s.y[i]),2,0,7);g.fill()}}
    else{g.beginPath();for(let i=0;i<s.x.length;i++){i?g.lineTo(X(s.x[i]),Y(s.y[i])):g.moveTo(X(s.x[i]),Y(s.y[i]))}g.stroke()}
  }
  g.restore();
}

// 對固定 t0，A、B 為線性最小平方解
function lin(t,y,t0){
  const n=t.length;let sx=0,sy=0,sxx=0,sxy=0;
  for(let i=0;i<n;i++){const e=Math.exp(-t[i]/t0);sx+=e;sy+=y[i];sxx+=e*e;sxy+=e*y[i]}
  const d=n*sxx-sx*sx;if(Math.abs(d)<1e-300)return null;
  const A=(n*sxy-sx*sy)/d,B=(sy-A*sx)/n;if(!(A>0))return null;let r=0;
  for(let i=0;i<n;i++){const e=y[i]-A*Math.exp(-t[i]/t0)-B;r+=e*e}
  return{A,B,r,t0};
}
function fit(t,y){
  const lo=Math.log(t[0]/2),hi=Math.log(t[t.length-1]);
  let best=null,bi=0;const N=300,grid=[];
  for(let i=0;i<=N;i++){const f=lin(t,y,Math.exp(lo+(hi-lo)*i/N));grid.push(f);if(f&&(!best||f.r<best.r)){best=f;bi=i}}
  if(!best)return null;
  let a=lo+(hi-lo)*Math.max(bi-1,0)/N,b=lo+(hi-lo)*Math.min(bi+1,N)/N;
  const gr=(Math.sqrt(5)-1)/2;
  for(let k=0;k<60;k++){
    const c=b-gr*(b-a),d=a+gr*(b-a),fc=lin(t,y,Math.exp(c)),fd=lin(t,y,Math.exp(d));
    if(fc&&(!fd||fc.r<fd.r))b=d;else a=c;
  }
  return lin(t,y,Math.exp((a+b)/2))||best;
}

function run(){
  const {t,I}=data,n=t.length;
  plot($("c1"),[{x:t,y:I,color:"--c1"}],"時間 (s)","強度");
  const dts=[];for(let i=1;i<n;i++)dts.push(t[i]-t[i-1]);
  dts.sort((a,b)=>a-b);const dt=dts[dts.length>>1];
  let m=0;if($("sub").checked){for(const v of I)m+=v;m/=n}
  const z=I.map(v=>v-m),maxLag=Math.min(n>>2,4000);
  const lag=[],g=[];
  for(let k=0;k<=maxLag;k++){let s=0;for(let i=0;i+k<n;i++)s+=z[i]*z[i+k];g.push(s/(n-k));lag.push(k*dt)}
  const g0=g[0];for(let i=0;i<g.length;i++)g[i]/=g0;
  const f=fit(lag.slice(1),g.slice(1));
  if(!f){plot($("c2"),[{x:lag,y:g,color:"--c2",dots:true}],"延遲時間 τ (s)","自相關");$("badge").hidden=true;$("par").textContent="";$("msg").textContent="找不到符合指數衰減（A>0）的擬合，自相關可能沒有衰減。";return}
  const fx=lag.slice(1),fy=fx.map(x=>f.A*Math.exp(-x/f.t0)+f.B);
  plot($("c2"),[{x:lag,y:g,color:"--c2",dots:true},{x:fx,y:fy,color:"--fit",w:2.5}],"延遲時間 τ (s)","自相關");
  $("badge").hidden=false;
  $("t0").textContent=fmt(f.t0)+" s";
  $("par").textContent="A = "+fmt(f.A)+"，B = "+fmt(f.B)+"；取樣間隔 ≈ "+fmt(dt)+" s，共 "+n+" 點";
}

$("f").addEventListener("change",async e=>{
  const file=e.target.files[0];if(!file)return;
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true});
    const t=[],I=[];
    for(let r=1;r<rows.length;r++){
      const a=parseFloat(rows[r][0]),l=parseFloat(rows[r][11]);
      if(isFinite(a)&&isFinite(l)){t.push(a);I.push(l)}
    }
    if(t.length<10)throw new Error("有效資料少於 10 筆，請確認 A 欄與 L 欄。");
    data={t,I};$("msg").textContent=file.name+"：讀入 "+t.length+" 筆資料";
    run();
  }catch(err){$("msg").textContent="讀取失敗："+err.message}
});
$("sub").addEventListener("change",()=>data&&run());
window.addEventListener("resize",()=>data&&run());
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
